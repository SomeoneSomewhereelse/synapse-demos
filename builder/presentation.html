<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Presentation Mode Preview</title>
<style>
  /* The real presentation screen, under a one-line note for reviewers. */
  :root { --note-bg: var(--card2, #eef3f8); --note-ink: var(--ink, #111c35); --note-line: var(--line, #b8c2d1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; background: var(--bg, #f7f9fc); color: var(--ink, #111c35); }
  .review-note {
    margin: 0; padding: 10px 16px; font: 15px/1.5 "Heebo Variable", system-ui, sans-serif;
    background: var(--note-bg); color: var(--note-ink); border-bottom: 1px solid var(--note-line); text-align: center;
  }
  .review-note a { color: inherit; }
</style>
</head>
<body>
<p class="review-note" dir="ltr" lang="en">Issue #168 preview: TovSpace presentation mode with the new "Spreadsheet calculations" card (card 6). Real screen from the build; nothing is saved. <a href="./sheet-calc.html">Task demo</a></p>
<div id="root"></div>
<script type="module" src="./presentation-entry.jsx"></script>
</body>
</html>
